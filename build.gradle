plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = "https://maven.meteordev.org/snapshots" }
}

dependencies {
    // Minecraft compiled against INTERMEDIARY names (net.minecraft.class_XXX),
    // which matches the source in this project (like the FakeClient recipe).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
    // Bundle Meteor inside the jar so Aero Client is ONE file (remove any separate Meteor jar from mods/)
    include "meteordevelopment:meteor-client:${project.meteor_version}"

    // slf4j / gson are bundled with fabric-loader at runtime but aren't on
    // loom's compile classpath for intermediary builds.
    compileOnly "org.slf4j:slf4j-api:2.0.13"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
